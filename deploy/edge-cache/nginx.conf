# Edge-cache: emulación local del CDN (ADR-008 · docs/02-arquitectura.md).
# Regla de oro: assets y catálogo GET se cachean; hot path (inventario, órdenes,
# pagos, fila) y SignalR JAMÁS se cachean (Cache-Control: no-store).

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge:10m max_size=100m inactive=10m use_temp_path=off;

upstream gateway {
    server gateway:8080;
    keepalive 16;
}

upstream spa {
    server spa:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # --- SPA React (origen de estáticos) ---
    location / {
        proxy_pass http://spa;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Assets con hash: inmutables, cacheados días en el borde ---
    location /assets/ {
        proxy_pass http://spa;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache edge;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- Hot path: bypass total de caché ---
    location ~ ^/api/(inventory|orders|payments|queue)/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }

    # --- SignalR (Fase 4): upgrade de websocket, sin caché ---
    location /hubs/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    # --- Resto de /api (catálogo GET): cacheable en el borde, TTL corto ---
    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache edge;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=0, s-maxage=30, stale-while-revalidate=60" always;
    }

    # Salud del propio edge (usado por smoke tests)
    location = /edge-healthz {
        access_log off;
        return 200 "edge-cache ok\n";
    }
}
